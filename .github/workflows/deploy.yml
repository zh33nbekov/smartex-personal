name: 🚀 Deploy smx-personal (Production)

on:
   push:
      branches:
         - dev

jobs:
   deploy:
      name: 🛠 Build & Deploy
      runs-on: ubuntu-latest

      steps:
         - name: 🔄 Checkout repository
           uses: actions/checkout@v3

         - name: 🧰 Install Vercel CLI
           run: npm install -g vercel

         - name: 🚀 Run production deploy
           env:
              SMX_TOKEN: ${{ secrets.SMX_TOKEN }}
           run: vercel --prod --confirm --token=$SMX_TOKEN
